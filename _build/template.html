<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>CHANGSHA · 湘江 / Real City</title>
<style>
  :root{
    --ink: rgba(238,242,250,.94);
    --ink-2: rgba(206,216,234,.62);
    --ink-3: rgba(180,196,222,.34);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#04060b;overflow:hidden;}
  body{
    font-family:"Inter","SF Pro Display",-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;
  }
  #app{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}
  .ui{position:fixed;z-index:10;pointer-events:none;}
  .ui *{pointer-events:auto;}
  #brand{top:34px;left:40px;}
  #brand .row{display:flex;align-items:flex-start;gap:14px;}
  #brand .bar{width:2px;height:42px;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0));margin-top:2px;}
  #brand h1{font-size:15px;font-weight:500;letter-spacing:.42em;line-height:1;text-shadow:0 0 22px rgba(120,180,255,.35);}
  #brand .sub{margin-top:9px;font-size:9px;letter-spacing:.26em;color:var(--ink-3);font-family:ui-monospace,Menlo,monospace;}
  #brand .sub b{color:var(--ink-2);font-weight:400;}
  #nav{left:40px;bottom:44px;display:flex;flex-direction:column;gap:0;}
  #nav button{background:none;border:0;color:var(--ink-3);cursor:pointer;font-family:inherit;font-size:10px;
    letter-spacing:.28em;text-transform:uppercase;padding:11px 0;text-align:left;display:flex;align-items:center;gap:10px;transition:color .35s ease;}
  #nav button .n{font-family:ui-monospace,Menlo,monospace;font-size:8px;opacity:.55;width:14px;}
  #nav button .ln{width:0;height:1px;background:rgba(180,215,255,.9);transition:width .45s cubic-bezier(.2,.8,.2,1);}
  #nav button.on{color:var(--ink);}
  #nav button.on .ln{width:26px;}
  #nav button:hover{color:var(--ink-2);}
  #panel{right:40px;bottom:44px;display:flex;flex-direction:column;align-items:flex-end;gap:18px;}
  #panel .grp{display:flex;gap:8px;align-items:center;}
  #panel .lbl{font-family:ui-monospace,Menlo,monospace;font-size:8px;letter-spacing:.22em;color:var(--ink-3);margin-right:6px;}
  .chip{background:rgba(255,255,255,.03);border:1px solid rgba(160,190,230,.16);color:var(--ink-3);cursor:pointer;
    font-family:inherit;font-size:9px;letter-spacing:.2em;padding:7px 11px;text-transform:uppercase;transition:all .3s ease;border-radius:2px;}
  .chip:hover{color:var(--ink-2);border-color:rgba(160,190,230,.34);}
  .chip.on{color:#0a0f18;background:rgba(196,224,255,.92);border-color:rgba(196,224,255,.92);}
  #hourwrap{display:flex;align-items:center;gap:12px;}
  #hour{-webkit-appearance:none;appearance:none;width:132px;height:1px;background:linear-gradient(90deg,rgba(255,170,110,.7),rgba(140,180,255,.18));outline:none;cursor:pointer;}
  #hour::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:8px;border-radius:50%;background:#dce9ff;box-shadow:0 0 10px rgba(160,200,255,.9);cursor:pointer;}
  #hourv{font-family:ui-monospace,Menlo,monospace;font-size:9px;color:var(--ink-2);letter-spacing:.1em;width:34px;}
  #hint{left:50%;bottom:46px;transform:translateX(-50%);font-family:ui-monospace,Menlo,monospace;font-size:8px;
    letter-spacing:.24em;color:rgba(170,190,220,.30);white-space:nowrap;}
  #stats{right:40px;top:36px;text-align:right;font-family:ui-monospace,Menlo,monospace;font-size:8px;
    letter-spacing:.18em;color:rgba(170,190,220,.28);line-height:1.9;}
  #stats b{color:rgba(206,220,240,.55);font-weight:400;}
  .label{position:fixed;z-index:9;pointer-events:none;transform:translate(-50%,-50%);transition:opacity .4s ease;}
  .label .en{font-family:ui-monospace,Menlo,monospace;font-size:8px;letter-spacing:.22em;color:rgba(216,230,250,.72);white-space:nowrap;}
  .label .zh{font-size:10px;letter-spacing:.18em;color:rgba(238,244,255,.9);margin-top:3px;white-space:nowrap;}
  .label .dot{position:absolute;left:-9px;top:5px;width:3px;height:3px;border-radius:50%;background:rgba(200,225,255,.85);box-shadow:0 0 8px rgba(140,190,255,.9);}
  .label .stem{position:absolute;left:-8px;top:8px;width:1px;height:18px;background:rgba(170,200,240,.35);}
  #load{position:fixed;inset:0;z-index:100;background:#04060b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity 1.1s ease;}
  #load .t{font-family:ui-monospace,Menlo,monospace;font-size:9px;letter-spacing:.34em;color:rgba(180,200,230,.5);}
  #load .bar{width:180px;height:1px;background:rgba(255,255,255,.10);overflow:hidden;}
  #load .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,rgba(255,180,120,.9),rgba(150,200,255,.9));transition:width .4s ease;}
  #load.done{opacity:0;pointer-events:none;}
  /* 主线程被同步构建阻塞时，只有合成器动画还能跑——所以进度条用 CSS 动画驱动 */
  #load .t{position:relative;width:280px;height:12px;text-align:center;}
  #load .t span{position:absolute;left:0;right:0;top:0;opacity:0;animation:ltext 2.6s linear infinite;}
  #load .t span:nth-child(1){animation-delay:0s}
  #load .t span:nth-child(2){animation-delay:0.62s}
  #load .t span:nth-child(3){animation-delay:1.16s}
  #load .t span:nth-child(4){animation-delay:1.62s}
  @keyframes ltext{0%{opacity:0}6%{opacity:1}76%{opacity:1}88%{opacity:0}100%{opacity:0}}
  #lbar{animation:lbar 3.0s cubic-bezier(.22,.75,.3,1) forwards;}
  @keyframes lbar{from{width:1%}to{width:92%}}
  .vign{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 42%,rgba(0,0,0,.38) 100%);}
  .topline{position:fixed;top:0;left:0;right:0;height:1px;z-index:6;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(180,210,255,.16),rgba(255,255,255,0));pointer-events:none;}
  @media (max-width:820px){
    #brand{left:22px;top:24px;} #nav{left:22px;bottom:26px;} #panel{right:22px;bottom:26px;gap:12px;}
    #stats{display:none;} #hint{display:none;} #hour{width:92px;} #brand h1{font-size:12px;letter-spacing:.3em;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="vign"></div>
<div class="topline"></div>

<div class="ui" id="brand">
  <div class="row">
    <div class="bar"></div>
    <div>
      <h1>CHANGSHA</h1>
      <div class="sub">湘江 · <b>28.19°N 112.97°E</b> · OSM FOOTPRINTS</div>
    </div>
  </div>
</div>

<div class="ui" id="nav">
  <button data-mode="free" class="on"><span class="n">01</span><span class="ln"></span>FREE</button>
  <button data-mode="tour"><span class="n">02</span><span class="ln"></span>TOUR</button>
  <button data-mode="walk"><span class="n">03</span><span class="ln"></span>WALK</button>
</div>

<div class="ui" id="panel">
  <div class="grp">
    <span class="lbl">CSU</span>
    <button class="chip camp" data-camp="1">岳麓山</button>
    <button class="chip camp" data-camp="2">麓南</button>
    <button class="chip camp" data-camp="3">潇湘</button>
    <button class="chip solo" data-solo="1">独立</button>
  </div>
  <div class="grp">
    <span class="lbl">GO</span>
    <button class="chip go" data-go="cbd">国金中心</button>
    <button class="chip go" data-go="isle">橘子洲</button>
    <button class="chip go" data-go="ridge">岳麓山</button>
    <button class="chip go" data-go="all">全城</button>
  </div>
  <div class="grp">
    <span class="lbl">SKY</span>
    <button class="chip wx on" data-wx="clear">晴</button>
    <button class="chip wx" data-wx="cloudy">多云</button>
    <button class="chip wx" data-wx="rain">雨</button>
    <button class="chip wx" data-wx="fog">雾</button>
  </div>
  <div class="grp">
    <span class="lbl">ATMOS</span>
    <button class="chip on" data-t="fire">烟花</button>
    <button class="chip on" data-t="traffic">车流</button>
    <button class="chip on" data-t="veg">植被</button>
    <button class="chip on" data-t="ped">行人</button>
  </div>
  <div class="grp">
    <span class="lbl">QUALITY</span>
    <button class="chip q on" data-q="auto">AUTO</button>
    <button class="chip q" data-q="high">HIGH</button>
    <button class="chip q" data-q="mid">MID</button>
    <button class="chip q" data-q="low">LOW</button>
  </div>
  <div class="grp" id="hourwrap">
    <span class="lbl">TIME</span>
    <input id="hour" type="range" min="0" max="1440" value="1260" step="5" />
    <span id="hourv">21:10</span>
  </div>
</div>

<div class="ui" id="hint">左键环绕 · 右键平移 · 滚轮推拉 · WASD 移动 · QE 升降 · 双击定位 · WALK 下拖拽转头</div>
<div class="ui" id="stats">
  <div><b id="s-build">0</b> BUILDINGS</div>
  <div><b id="s-road">0</b> ROADS</div>
  <div><b id="s-tree">0</b> TREES</div>
  <div><b id="s-fps">60</b> FPS</div>
</div>

<div id="load">
  <div class="t">
    <span>DECODING FOOTPRINTS</span>
    <span>BUILDING ROAD NETWORK</span>
    <span>PLANTING VEGETATION</span>
    <span>COMPILING SHADERS</span>
  </div>
  <div class="bar"><i id="lbar"></i></div>
</div>

<!--BUNDLE-->
</body>
</html>
